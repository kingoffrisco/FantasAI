name = "fantasai-api"
main = "src/index.js"
compatibility_date = "2024-11-12"
account_id = "a121da9c5331b463f2c3651bd2e6e789"

workers_dev = true

routes = [
  { pattern = "api.fantasai.net/*", zone_name = "fantasai.net" }
]

[vars]
SLEEPER_BASE    = "https://api.sleeper.app/v1"
# CBS_WORKER_URL — set this to your fantasai-cbs workers.dev URL until you
# give the CBS worker a custom subdomain, e.g.:
#   https://fantasai-cbs.<your-subdomain>.workers.dev
CBS_WORKER_URL  = "https://fantasai-cbs.fantasai.workers.dev"

# Secrets (set with `wrangler secret put <NAME>`):
#   FANTASAI_KEY  — optional shared secret; clients must send X-FantasAI-Key header
