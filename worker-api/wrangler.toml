name = "fantasai-api"
main = "src/index.js"
compatibility_date = "2024-11-12"
account_id = "a121da9c5331b463f2c3651bd2e6e789"

workers_dev = true

routes = [
  { pattern = "api.fantasai.net/*", zone_name = "fantasai.net" }
]

[[r2_buckets]]
binding     = "BUCKET"
bucket_name = "fantasai-r2"

# Web Push subscription storage — create with: wrangler kv namespace create PUSH_SUBS
# Then paste the id below and uncomment. Also create via dash.cloudflare.com → Storage & Databases → KV
# [[kv_namespaces]]
# binding = "PUSH_SUBS"
# id = "<paste namespace id here>"

[vars]
SLEEPER_BASE             = "https://api.sleeper.app/v1"
CBS_WORKER_URL           = "https://fantasai-cbs.fantasai.workers.dev"
# DATABRICKS_HOST / DATABRICKS_URL — already set as secrets above
DATABRICKS_WAREHOUSE_ID  = "d0d577334268e08f"

# Secrets — add with: wrangler secret put <NAME> --name fantasai-api
#   FANTASAI_KEY          optional shared key for protected GET routes
#   RESEND_API_KEY        from resend.com — enables password reset emails
#   AWS_ACCESS_KEY_ID     R2 API token key ID  (for Databricks → R2 via S3-compatible API)
#   AWS_SECRET_ACCESS_KEY R2 API token secret  (for Databricks → R2 via S3-compatible API)
