name: Fantasy ETL -> S3

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week to backfill (blank = current week)'
        required: false
        default: ''
      season:
        description: 'Season year (blank = current season)'
        required: false
        default: ''

jobs:
  etl:
    name: Fetch -> S3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      API_BASE: https://api.fantasai.net
      S3_BUCKET: aws-kingoffrisco-s3-bucket
      S3_PREFIX: fantasai
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Resolve NFL week and season
        id: nfl
        run: |
          STATE=$(curl -sf https://api.sleeper.app/v1/state/nfl || echo '{}')
          API_WEEK=$(echo "$STATE"   | python3 -c "import sys,json; print(max(1,json.load(sys.stdin).get('week',1)))")
          API_SEASON=$(echo "$STATE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('season','2025'))")
          API_TYPE=$(echo "$STATE"   | python3 -c "import sys,json; print(json.load(sys.stdin).get('season_type','regular'))")
          WEEK="${{ github.event.inputs.week }}"
          SEASON="${{ github.event.inputs.season }}"
          [ -z "$WEEK" ]   && WEEK="$API_WEEK"
          [ -z "$SEASON" ] && SEASON="$API_SEASON"
          echo "week=$WEEK"       >> "$GITHUB_OUTPUT"
          echo "season=$SEASON"   >> "$GITHUB_OUTPUT"
          echo "stype=$API_TYPE"  >> "$GITHUB_OUTPUT"
          echo "Resolved: season=$SEASON week=$WEEK type=$API_TYPE"

      - name: Fetch API endpoints
        env:
          WEEK:   ${{ steps.nfl.outputs.week }}
          SEASON: ${{ steps.nfl.outputs.season }}
          STYPE:  ${{ steps.nfl.outputs.stype }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fantasai

          fetch() {
            local url="$1" dest="$2"
            echo "  GET $url"
            if curl -sf --max-time 30 "$url" -o "$dest"; then
              echo "  OK $(wc -c < "$dest") bytes"
            else
              echo "  SKIP (fetch failed)"
              rm -f "$dest"
            fi
          }

          fetch "$API_BASE/api/v1/injuries"                                               /tmp/fantasai/injuries.json
          fetch "$API_BASE/api/v1/stats/week?week=${WEEK}&season=${SEASON}&type=${STYPE}" /tmp/fantasai/stats_${SEASON}_week${WEEK}.json
          fetch "$API_BASE/api/v1/projections?week=${WEEK}&season=${SEASON}&type=${STYPE}" /tmp/fantasai/projections_${SEASON}_week${WEEK}.json
          fetch "$API_BASE/api/v1/league"                                                 /tmp/fantasai/league.json
          fetch "$API_BASE/api/v1/rosters"                                                /tmp/fantasai/rosters.json
          fetch "$API_BASE/api/v1/draft?year=${SEASON}"                                   /tmp/fantasai/draft_${SEASON}.json

          echo "Files fetched:"
          ls -lh /tmp/fantasai/

      - name: Tag files with ETL metadata
        env:
          WEEK:   ${{ steps.nfl.outputs.week }}
          SEASON: ${{ steps.nfl.outputs.season }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for f in /tmp/fantasai/*.json; do
            [ -f "$f" ] || continue
            jq --arg ts "$TS" --argjson w "${WEEK:-1}" --argjson s "${SEASON:-2025}" \
              'if type == "object" then . + {etl_fetched_at: $ts, etl_week: $w, etl_season: $s} else . end' \
              "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
          done

      - name: Upload to S3
        env:
          WEEK:   ${{ steps.nfl.outputs.week }}
          SEASON: ${{ steps.nfl.outputs.season }}
        run: |
          set -euo pipefail
          P="s3://${S3_BUCKET}/${S3_PREFIX}"

          up() {
            local src="$1" dst="$2"
            if [ -f "$src" ]; then
              aws s3 cp "$src" "$dst" --content-type "application/json" --quiet
              echo "  uploaded: $dst"
            else
              echo "  skipped (missing): $src"
            fi
          }

          up /tmp/fantasai/league.json   "${P}/league/latest.json"
          up /tmp/fantasai/rosters.json  "${P}/rosters/latest.json"
          up /tmp/fantasai/injuries.json "${P}/injuries/latest.json"

          up "/tmp/fantasai/draft_${SEASON}.json" \
             "${P}/draft/season=${SEASON}/data.json"

          up "/tmp/fantasai/stats_${SEASON}_week${WEEK}.json" \
             "${P}/stats/season=${SEASON}/week=${WEEK}/data.json"
          up "/tmp/fantasai/stats_${SEASON}_week${WEEK}.json" \
             "${P}/stats/season=${SEASON}/current_week.json"

          up "/tmp/fantasai/projections_${SEASON}_week${WEEK}.json" \
             "${P}/projections/season=${SEASON}/week=${WEEK}/data.json"
          up "/tmp/fantasai/projections_${SEASON}_week${WEEK}.json" \
             "${P}/projections/season=${SEASON}/current_week.json"

          echo ""
          echo "S3 contents:"
          aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/" --recursive
