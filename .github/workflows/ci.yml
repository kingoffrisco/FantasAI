name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if app exists
        id: app_check
        run: |
          if [ -f "app/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "app/ not in repo yet — skipping build"
          fi

      - name: Set up Node.js
        if: steps.app_check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.app_check.outputs.exists == 'true'
        run: npm ci
        working-directory: app

      - name: Build
        if: steps.app_check.outputs.exists == 'true'
        run: npm run build
        working-directory: app

      - name: Deploy to Cloudflare Pages
        if: steps.app_check.outputs.exists == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: fantasai-app
          directory: app/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
